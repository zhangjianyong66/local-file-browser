server {
    listen 80;
    listen [::]:80;
    server_name files.zhangjianyong.top;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name files.zhangjianyong.top;

    ssl_certificate /etc/letsencrypt/live/files.zhangjianyong.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.zhangjianyong.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;

    # The application accepts files up to 5 MiB; retain room for multipart overhead.
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        # FRPS routes HTTP proxies by the original Host header.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
